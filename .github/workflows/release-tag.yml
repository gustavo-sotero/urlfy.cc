name: Release Tag

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Tag successful main build
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out the validated commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Fetch refs used for release gating
        run: |
          git fetch origin main --tags --force

          if git ls-remote --exit-code --heads origin release >/dev/null 2>&1; then
            git fetch origin release:refs/remotes/origin/release --force
          fi

      - name: Resolve automatic release tag
        id: tag
        run: |
          commit_epoch="$(git show -s --format=%ct HEAD)"
          release_stamp="$(date -u -d "@$commit_epoch" +%Y%m%d%H%M%S)"
          short_sha="$(git rev-parse --short=12 HEAD)"
          tag_name="release-$release_stamp-$short_sha"

          if ! printf '%s' "$tag_name" | grep -Eq '^release-[0-9]{14}-[0-9a-f]{12}$'; then
            echo "::error::Generated tag '$tag_name' is not valid."
            exit 1
          fi

          echo "stamp=$release_stamp" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "name=$tag_name" >> "$GITHUB_OUTPUT"

      - name: Verify this workflow is still on the latest main commit
        id: gate
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          TAG_NAME: ${{ steps.tag.outputs.name }}
        run: |
          current_main_sha="$(git rev-parse origin/main)"

          if [ "$current_main_sha" != "$HEAD_SHA" ]; then
            echo "A newer commit is already at origin/main; skipping stale release for $HEAD_SHA."
            echo "release_ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git rev-parse -q --verify "refs/tags/$TAG_NAME" >/dev/null; then
            existing_sha="$(git rev-list -n 1 "$TAG_NAME")"

            if [ "$existing_sha" = "$HEAD_SHA" ]; then
              echo "Tag $TAG_NAME already exists for this commit; nothing to do."
              echo "release_ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "::error::Tag $TAG_NAME already exists for $existing_sha."
            exit 1
          fi

          if git show-ref --verify --quiet refs/remotes/origin/release; then
            if ! git merge-base --is-ancestor refs/remotes/origin/release "$HEAD_SHA"; then
              echo "::error::origin/release does not point to a main-line ancestor of $HEAD_SHA. Resolve the release branch manually before the next automated promotion."
              exit 1
            fi
          fi

          echo "release_ready=true" >> "$GITHUB_OUTPUT"

      - name: Configure git identity
        if: steps.gate.outputs.release_ready == 'true'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Create annotated release tag
        if: steps.gate.outputs.release_ready == 'true'
        env:
          TAG_NAME: ${{ steps.tag.outputs.name }}
          RELEASE_STAMP: ${{ steps.tag.outputs.stamp }}
          RELEASE_SHA: ${{ steps.tag.outputs.short_sha }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          # GH_RELEASE_TOKEN must be a PAT (repo + workflow scopes).
          # GITHUB_TOKEN cannot trigger downstream workflows (GitHub security restriction).
          GH_RELEASE_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
        run: |
          git tag -a "$TAG_NAME" "$HEAD_SHA" -m "Release $RELEASE_STAMP ($RELEASE_SHA)"
          git -c "url.https://x-access-token:${GH_RELEASE_TOKEN}@github.com/.insteadOf=https://github.com/" \
            push origin "refs/tags/$TAG_NAME"

      - name: Move release branch to the tagged commit
        if: steps.gate.outputs.release_ready == 'true'
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_RELEASE_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
        run: |
          git branch -f release "$HEAD_SHA"
          git -c "url.https://x-access-token:${GH_RELEASE_TOKEN}@github.com/.insteadOf=https://github.com/" \
            push origin release:release