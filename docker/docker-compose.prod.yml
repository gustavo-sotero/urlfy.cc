# ═══════════════════════════════════════════════════════════════════
# PRODUCTION (Dokploy) - App + GeoIP
# ═══════════════════════════════════════════════════════════════════
# Usado no Dokploy como serviço do tipo "Compose".
# PostgreSQL, Redis e SigNoz vêm de templates separados do Dokploy.
#
# Variáveis de ambiente configuradas no Dokploy:
#   DATABASE_URL, REDIS_URL, BETTER_AUTH_SECRET, JWT_SECRET,
#   INTERNAL_API_SECRET, NEXT_PUBLIC_APP_URL, OTEL_EXPORTER_OTLP_ENDPOINT
# ═══════════════════════════════════════════════════════════════════

services:
  # ─── Application ───────────────────────────────────────────────
  # Migrations run automatically via docker-entrypoint.sh before
  # the app starts. To run migrations independently:
  #   docker compose -f docker-compose.prod.yml run --rm app \
  #     sh -c "MIGRATION_ONLY=true docker-entrypoint.sh echo done"
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runner
      args:
        # NEXT_PUBLIC_* vars are inlined at build time by Next.js.
        # In Dokploy: configure these as "Build Arguments".
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://urlfy.cc}
    init: true
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - MIGRATION_TIMEOUT=${MIGRATION_TIMEOUT:-120}
      - DB_CHECK_TIMEOUT=${DB_CHECK_TIMEOUT:-10}
      - REDIS_URL=${REDIS_URL}
      - REDIS_HOST=${REDIS_HOST:-}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - GEOIP_DB_PATH=/app/geoip/GeoLite2-City.mmdb
      # Auth
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-${NEXT_PUBLIC_APP_URL}}
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET}
      - INTERNAL_ANALYTICS_SECRET=${INTERNAL_ANALYTICS_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      - TRUSTED_ORIGINS=${TRUSTED_ORIGINS:-}
      # OAuth (optional)
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      # Email (optional)
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEND_FROM=${RESEND_FROM:-}
      # OpenTelemetry (SigNoz)
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-urlfy-api}
      - OTEL_SERVICE_VERSION=${OTEL_SERVICE_VERSION:-0.1.0}
      - TELEMETRY_ENABLED=${TELEMETRY_ENABLED:-false}
    volumes:
      - geoip_data:/app/geoip:ro
    networks:
      - dokploy-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 768M
        reservations:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: '100m'
        max-file: '5'
    security_opt:
      - no-new-privileges:true

  geoip-downloader:
    build:
      context: ../docker/geoip
      dockerfile: Dockerfile
    environment:
      - GEOIP_DB_PATH=/app/geoip/GeoLite2-City.mmdb
      - GEOIP_MAX_AGE_DAYS=25
      - GEOIP_MMDB_URL=https://cdn.jsdelivr.net/npm/geolite2-city/GeoLite2-City.mmdb.gz
    volumes:
      - geoip_data:/app/geoip
    # Usa o entrypoint padrão que faz download + inicia cron mensal
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '2'

volumes:
  geoip_data:

networks:
  dokploy-network:
    external: true
