# ═══════════════════════════════════════════════════════════════════
# DEVELOPMENT OVERRIDE
# ═══════════════════════════════════════════════════════════════════
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# NOTE: In development, we override localhost bindings to allow external access
#       for debugging tools and local development convenience.

services:
  app:
    build:
      target: builder
    command: ['bun', 'dev']
    init: true
    environment:
      - NODE_ENV=development
    volumes:
      - ../src:/app/src
      - ../.env:/app/.env:ro
    ports:
      - '3000:3000'
    # Override: remove resource limits for development
    deploy:
      resources: {}

  postgres:
    # Override: expose to all interfaces for local dev tools
    ports:
      - '5432:5432'
    environment:
      POSTGRES_PASSWORD: urlfy
    # Override: remove resource limits for development
    deploy:
      resources: {}

  redis:
    # Override: expose to all interfaces for local dev tools
    ports:
      - '6379:6379'
    # Override: remove resource limits for development
    deploy:
      resources: {}

  # Development-only services
  postgres-admin:
    image: dpage/pgadmin4:8.14 # Pinned version
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@urlfy.cc
      - PGADMIN_DEFAULT_PASSWORD=admin
      - PGADMIN_CONFIG_SERVER_MODE=False
    ports:
      - '5050:80'
    networks:
      - urlfy-network
    profiles:
      - tools

  redis-commander:
    image: rediscommander/redis-commander:latest
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - '8081:8081'
    networks:
      - urlfy-network

# ═════════════════════════════════════════════════════════════════════
# NETWORKS (must be defined for override file)
# ═════════════════════════════════════════════════════════════════════
networks:
  urlfy-network:
    name: urlfy-network
