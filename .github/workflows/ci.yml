# ═══════════════════════════════════════════════════════════════════
# CI Pipeline - urlfy.cc
# ═══════════════════════════════════════════════════════════════════
# Runs on every push to main/develop and on pull requests.
# Steps: lint, type-check, test, build, migration validation.
# ═══════════════════════════════════════════════════════════════════

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: '1'

jobs:
  # ─── Lint & Type Check ──────────────────────────────────────────
  quality:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome lint
        run: bunx biome check .

      - name: TypeScript type check
        run: bunx tsc --noEmit

  # ─── Unit & Integration Tests ───────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: quality

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: urlfy_test
          POSTGRES_PASSWORD: urlfy_test_pass
          POSTGRES_DB: urlfy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U urlfy_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://urlfy_test:urlfy_test_pass@localhost:5432/urlfy_test
      REDIS_URL: redis://localhost:6379
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      NODE_ENV: test
      BETTER_AUTH_SECRET: ci-test-secret-minimum-32-characters-long
      JWT_SECRET: ci-test-jwt-secret-minimum-32-characters
      INTERNAL_API_SECRET: ci-test-internal-secret
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      SKIP_ENV_VALIDATION: true

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run database migrations
        run: bun run db:migrate:prod

      - name: Run unit tests
        run: bun test src/

      - name: Run integration tests
        run: bun test tests/integration/

      - name: Run security tests
        run: bun test tests/security/

  # ─── Migration Validation ───────────────────────────────────────
  migrations:
    name: Migration Safety Check
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: urlfy_migrate
          POSTGRES_PASSWORD: urlfy_migrate_pass
          POSTGRES_DB: urlfy_migrate
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U urlfy_migrate"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://urlfy_migrate:urlfy_migrate_pass@localhost:5432/urlfy_migrate

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check migration files are committed
        run: |
          # Generate migrations from current schema
          bun run db:generate 2>/dev/null || true

          # Check if there are uncommitted migration files
          if git diff --name-only | grep -q "^drizzle/"; then
            echo "❌ ERROR: Schema changes detected but migration files are not committed!"
            echo ""
            echo "Run 'bun run db:generate' locally and commit the migration files."
            git diff --stat
            exit 1
          fi
          echo "✅ Migration files are up to date"

      - name: Test migrations apply cleanly
        run: |
          echo "⏳ Applying all migrations to a fresh database..."
          bun run db:migrate:prod
          echo "✅ All migrations applied successfully"

      - name: Test migrations are idempotent
        run: |
          echo "⏳ Re-running migrations (should be a no-op)..."
          bun run db:migrate:prod
          echo "✅ Migrations are idempotent"

  # ─── Build Verification ─────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [quality, migrations]

    env:
      SKIP_ENV_VALIDATION: true

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Next.js application
        run: bun run build

      - name: Verify standalone output
        run: |
          test -f .next/standalone/server.js || (echo "❌ standalone/server.js missing" && exit 1)
          echo "✅ Standalone build verified"

  # ─── Docker Image Build ─────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: runner
          push: false
          tags: urlfy-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Docker image
        run: |
          docker run --rm urlfy-app:${{ github.sha }} test -f /app/server.js
          docker run --rm urlfy-app:${{ github.sha }} test -f /app/migrate.ts
          docker run --rm urlfy-app:${{ github.sha }} test -d /app/drizzle
          echo "✅ Docker image verified"
