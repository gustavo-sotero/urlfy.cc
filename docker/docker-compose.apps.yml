# ═══════════════════════════════════════════════════════════════════
# MULTI-SERVICE OVERLAY — extends docker-compose.yml
# Usage:
#   docker compose -f docker/docker-compose.yml \
#                  -f docker/docker-compose.apps.yml up -d
#
# All three app services (web, api, worker) run in Docker alongside
# the Postgres + Redis + GeoIP infrastructure from docker-compose.yml.
# ═══════════════════════════════════════════════════════════════════

services:
  # ─── API Server (Elysia, port 3001) ───────────────────────────
  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
      target: runner
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - API_PORT=3001
      - DATABASE_URL=${DATABASE_URL:-postgresql://urlfy:urlfy@postgres:5432/urlfy}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:3000}
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET}
      - INTERNAL_ANALYTICS_SECRET=${INTERNAL_ANALYTICS_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - TRUSTED_ORIGINS=${TRUSTED_ORIGINS:-http://localhost:3000}
      - GEOIP_DB_PATH=/app/geoip/GeoLite2-City.mmdb
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - TELEMETRY_ENABLED=${TELEMETRY_ENABLED:-false}
    volumes:
      - geoip_data:/app/geoip:ro
    ports:
      - '127.0.0.1:3001:3001'
    healthcheck:
      # Use the readiness probe (/health/ready) instead of the liveness probe
      # (/health) to verify DB + Redis are also reachable before web depends on
      # this container as healthy.
      test: ['CMD-SHELL', 'curl -fsS http://localhost:3001/api/health/ready || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - urlfy_net

  # ─── Web App (Next.js, port 3000) ─────────────────────────────
  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    init: true
    depends_on:
      api:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=3000
        - API_INTERNAL_URL=${API_INTERNAL_URL:-http://api:3001}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - DATABASE_URL=${DATABASE_URL:-postgresql://urlfy:urlfy@postgres:5432/urlfy}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:3000}
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - GEOIP_DB_PATH=/app/geoip/GeoLite2-City.mmdb
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - TELEMETRY_ENABLED=${TELEMETRY_ENABLED:-false}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    volumes:
      - geoip_data:/app/geoip:ro
    ports:
      - '0.0.0.0:3000:3000'
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:3000/api/health/ready || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - urlfy_net

  # ─── Background Worker ────────────────────────────────────────
  worker:
    build:
      context: ..
      dockerfile: docker/worker.Dockerfile
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgresql://urlfy:urlfy@postgres:5432/urlfy}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - GEOIP_DB_PATH=/app/geoip/GeoLite2-City.mmdb
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET}
      - INTERNAL_ANALYTICS_SECRET=${INTERNAL_ANALYTICS_SECRET}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - TELEMETRY_ENABLED=${TELEMETRY_ENABLED:-false}
    volumes:
      - geoip_data:/app/geoip:ro
    healthcheck:
      test: ['CMD-SHELL', 'bun run healthcheck || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - urlfy_net

networks:
  urlfy_net:
    driver: bridge
