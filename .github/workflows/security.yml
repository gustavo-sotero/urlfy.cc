name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run security scan daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write # For uploading SARIF results

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ═══════════════════════════════════════════════════════════════
      # Check for test secrets in production
      # ═══════════════════════════════════════════════════════════════
      - name: Check for test secrets
        run: bun run security:test-secrets
        env:
          # Set production-like secrets to ensure validation passes
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'production-jwt-secret-minimum-32-chars-long-placeholder' }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'production-auth-secret-minimum-32-chars-long' }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'production-auth-secret-minimum-32-chars-long-x' }}

      # ═══════════════════════════════════════════════════════════════
      # Bun audit (checks for known vulnerabilities)
      # ═══════════════════════════════════════════════════════════════
      - name: Run bun audit
        run: bun audit --production
        continue-on-error: true # Don't fail build on audit findings

      # ═══════════════════════════════════════════════════════════════
      # Snyk security scan
      # ═══════════════════════════════════════════════════════════════
      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --all-projects

      # ═══════════════════════════════════════════════════════════════
      # Upload results to GitHub Security tab
      # ═══════════════════════════════════════════════════════════════
      - name: Upload Snyk results to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: snyk.sarif

      # ═══════════════════════════════════════════════════════════════
      # Generate security report
      # ═══════════════════════════════════════════════════════════════
      - name: Generate security report
        run: bun run security:report
        continue-on-error: true

      - name: Upload security report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report
          path: security-report.json
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════════
  # Additional security checks
  # ═══════════════════════════════════════════════════════════════════
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0 # Example: block copyleft licenses
