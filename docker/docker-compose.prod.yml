# ═══════════════════════════════════════════════════════════════════
# PRODUCTION OVERRIDE
# ═══════════════════════════════════════════════════════════════════
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# SECURITY NOTES:
# - Ensure all secrets are provided via environment variables or Docker secrets
# - Database ports should NOT be exposed externally (use VPN/bastion for access)
# - Consider using Docker Swarm or Kubernetes for production deployments

services:
  app:
    build:
      target: runner
    init: true
    environment:
      - NODE_ENV=production
    # Remove port exposure - use reverse proxy (nginx/traefik) in production
    ports: []
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: '100m'
        max-file: '5'
        labels: 'service,env'
    labels:
      - 'service=urlfy-app'
      - 'env=production'

  postgres:
    # Remove port exposure in production - access via internal network only
    ports: []
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: '200m'
        max-file: '5'

  redis:
    # Remove port exposure in production
    ports: []
    command: >-
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 1gb
      --maxmemory-policy allkeys-lru
      --tcp-keepalive 60
      --timeout 0
      --requirepass ${REDIS_PASSWORD}
      --protected-mode yes
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: '100m'
        max-file: '3'

  # Production monitoring (pinned versions)
  node-exporter:
    image: prom/node-exporter:v1.8.2
    command:
      - '--path.rootfs=/host'
    volumes:
      - /:/host:ro,rslave
    networks:
      - urlfy-network
    profiles:
      - monitoring

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - urlfy-network
    profiles:
      - monitoring

# ═════════════════════════════════════════════════════════════════════
# NETWORKS (required for override files)
# ═════════════════════════════════════════════════════════════════════
networks:
  urlfy-network:
    name: urlfy-network
