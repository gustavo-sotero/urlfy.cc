# ═══════════════════════════════════════════════════════════════════
# LOCAL DEVELOPMENT - docker compose up -d
# ═══════════════════════════════════════════════════════════════════
# Sobe PostgreSQL + Redis para desenvolvimento local.
# A app roda fora do Docker via "bun run dev".
#
# Produção (Dokploy): PostgreSQL, Redis e SigNoz são serviços
# separados no Dokploy (templates). Apenas o Dockerfile da app
# e o geoip-downloader são usados do repositório.
# ═══════════════════════════════════════════════════════════════════

services:
  # ═══════════════════════════════════════════════════════════════════
  # POSTGRESQL 16 (dev only)
  # ═══════════════════════════════════════════════════════════════════
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: urlfy
      POSTGRES_PASSWORD: ${DB_PASSWORD:-urlfy}
      POSTGRES_DB: urlfy
      POSTGRES_INITDB_ARGS: '--encoding=UTF-8 --lc-collate=C --lc-ctype=C'
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U urlfy -d urlfy']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════
  # REDIS 7 (dev only)
  # ═══════════════════════════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    command: >-
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --tcp-keepalive 60
      --timeout 0
      --protected-mode no
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════
  # GEOIP DOWNLOADER (Credential-free auto-download)
  # ═══════════════════════════════════════════════════════════════════
  geoip-downloader:
    build:
      context: ./geoip
      dockerfile: Dockerfile
    environment:
      - GEOIP_DB_PATH=/app/geoip/GeoLite2-City.mmdb
      - GEOIP_MAX_AGE_DAYS=25
      - GEOIP_MMDB_URL=https://cdn.jsdelivr.net/npm/geolite2-city/GeoLite2-City.mmdb.gz
    volumes:
      - geoip_data:/app/geoip
    restart: 'no'
    entrypoint: []
    command: ['/usr/local/bin/geoip-refresh.sh']

# ═════════════════════════════════════════════════════════════════════
# VOLUMES
# ═════════════════════════════════════════════════════════════════════
volumes:
  postgres_data:
    name: urlfy_postgres_data
  redis_data:
    name: urlfy_redis_data
  geoip_data:
    name: urlfy_geoip_data
