# Bun configuration file
# See: https://bun.sh/docs/runtime/bunfig

[test]
# NOTE: Each app in apps/* has its own bunfig.toml with the correct preload
# for its tests/setup.ts. The root does not have a global test setup file,
# so no preload is defined here. Run tests via turbo (bun run test:unit)
# to ensure each workspace uses its own bunfig.toml.

# Test timeout (in milliseconds) - default is 5000
timeout = 10000

# Coverage configuration
coverage = false
coverageDir = "coverage"

# Reporter
#reporter = "spec"

# Retry failed tests
retry = 0

# Bail on first failure (useful for CI)
bail = false

# Exclude Playwright e2e tests (they use .spec.ts and should be run with `bun run test:e2e`)
# Bun test will pick up files matching *.test.ts but NOT *.spec.ts by default,
# however explicit file patterns can override this if needed.
