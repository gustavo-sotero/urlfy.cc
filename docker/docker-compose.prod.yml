# ═══════════════════════════════════════════════════════════════════
# PRODUCTION (Dokploy) - Multi-Service: web + api + worker + GeoIP
# ═══════════════════════════════════════════════════════════════════
# Usado no Dokploy como serviço do tipo "Compose".
# PostgreSQL e Redis vêm de templates separados do Dokploy.
# O collector OTLP (e.g. grafana/otel-lgtm) é provisionado separadamente
# e exposto na rede dokploy-network.
#
# Variáveis de ambiente configuradas no Dokploy:
#   DATABASE_URL, REDIS_URL, BETTER_AUTH_SECRET, JWT_SECRET,
#   INTERNAL_API_SECRET, INTERNAL_ANALYTICS_SECRET,
#   NEXT_PUBLIC_APP_URL, OTEL_EXPORTER_OTLP_ENDPOINT
#
# Arquitetura de serviços:
#   migrate → roda migrações e sai (depends_on: service_completed_successfully)
#   api     → Elysia API em :3001, depende de migrate
#   web     → Next.js em :3000, proxy /api/* → api:3001
#   worker  → Bun workers Redis Streams, depende de migrate
# ═══════════════════════════════════════════════════════════════════

services:
  # ─── Database Migrations ───────────────────────────────────────
  # Runs DB migrations once and exits. api + worker wait for
  # service_completed_successfully before starting.
  # To skip: set SKIP_MIGRATIONS=true in Dokploy env.
  migrate:
    build:
      context: ..
      dockerfile: docker/worker.Dockerfile
    working_dir: /app
    command: ['bun', 'run', 'db:migrate:prod']
    init: true
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - MIGRATION_TIMEOUT=${MIGRATION_TIMEOUT:-120}
      - DB_CHECK_TIMEOUT=${DB_CHECK_TIMEOUT:-10}
      - SKIP_MIGRATIONS=${SKIP_MIGRATIONS:-false}
    networks:
      - dokploy-network
    restart: 'no'
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '2'

  # ─── API Service (Elysia) ──────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    init: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - REDIS_HOST=${REDIS_HOST:-}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - GEOIP_DB_PATH=/app/geoip/GeoLite2-City.mmdb
      # Auth
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-${NEXT_PUBLIC_APP_URL}}
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET}
      - INTERNAL_ANALYTICS_SECRET=${INTERNAL_ANALYTICS_SECRET:-}
      - JWT_SECRET=${JWT_SECRET}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      - TRUSTED_ORIGINS=${TRUSTED_ORIGINS:-}
      # OAuth (optional)
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      # Email (optional)
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEND_FROM=${RESEND_FROM:-}
      # OpenTelemetry — base URL for OTLP HTTP collector (grafana/otel-lgtm or any OTLP backend).
      # Set to the base URL WITHOUT /v1/* signal suffix; the app appends it automatically.
      # Trailing slashes are normalized: 'https://collector.urlfy.cc/' works correctly.
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      # Optional per-signal overrides — used as-is when set (no suffix appended).
      - OTEL_EXPORTER_OTLP_LOGS_ENDPOINT=${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:-}
      - OTEL_EXPORTER_OTLP_METRICS_ENDPOINT=${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-}
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      # Optional comma-separated OTLP headers (e.g. for Grafana Cloud auth).
      - OTEL_EXPORTER_OTLP_HEADERS=${OTEL_EXPORTER_OTLP_HEADERS:-}
      - OTEL_EXPORTER_OTLP_LOGS_HEADERS=${OTEL_EXPORTER_OTLP_LOGS_HEADERS:-}
      - OTEL_EXPORTER_OTLP_METRICS_HEADERS=${OTEL_EXPORTER_OTLP_METRICS_HEADERS:-}
      - OTEL_EXPORTER_OTLP_TRACES_HEADERS=${OTEL_EXPORTER_OTLP_TRACES_HEADERS:-}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-urlfy-api}
      - OTEL_SERVICE_VERSION=${OTEL_SERVICE_VERSION:-0.1.0}
      - TELEMETRY_ENABLED=${TELEMETRY_ENABLED:-false}
    volumes:
      - geoip_data:/app/geoip:ro
    networks:
      - dokploy-network
    restart: unless-stopped
    healthcheck:
      # Readiness probe: verifies DB + Redis are reachable before web depends on
      # this container. Fail if either dependency is unavailable.
      test: ['CMD', 'curl', '-fsS', 'http://localhost:3001/api/health/ready']
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: '100m'
        max-file: '5'
    security_opt:
      - no-new-privileges:true

  # ─── Web Service (Next.js) ─────────────────────────────────────
  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
      args:
        # NEXT_PUBLIC_* vars inlined at build time by Next.js.
        # In Dokploy: configure as "Build Arguments".
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://urlfy.cc}
    init: true
    depends_on:
      api:
        condition: service_healthy
    environment:
      - NODE_ENV=production
        # Internal service routing — override when topology differs
      - API_INTERNAL_URL=${API_INTERNAL_URL:-http://api:3001}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      # Database (needed for redirect cache-miss fallback)
      - DATABASE_URL=${DATABASE_URL}
      # Auth (needed for session/cookie middleware)
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-${NEXT_PUBLIC_APP_URL}}
      - JWT_SECRET=${JWT_SECRET}
      # Redis (needed for web-level rate limiting)
      - REDIS_URL=${REDIS_URL}
      - REDIS_HOST=${REDIS_HOST:-}
      - REDIS_PORT=${REDIS_PORT:-6379}
      # Internal API for gateway anti-abuse
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET}
      # GeoIP (needed for redirect analytics)
      - GEOIP_DB_PATH=/app/geoip/GeoLite2-City.mmdb
      # OpenTelemetry — same collector base URL as API service.
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_EXPORTER_OTLP_LOGS_ENDPOINT=${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:-}
      - OTEL_EXPORTER_OTLP_METRICS_ENDPOINT=${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-}
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      - OTEL_EXPORTER_OTLP_HEADERS=${OTEL_EXPORTER_OTLP_HEADERS:-}
      - OTEL_EXPORTER_OTLP_LOGS_HEADERS=${OTEL_EXPORTER_OTLP_LOGS_HEADERS:-}
      - OTEL_EXPORTER_OTLP_METRICS_HEADERS=${OTEL_EXPORTER_OTLP_METRICS_HEADERS:-}
      - OTEL_EXPORTER_OTLP_TRACES_HEADERS=${OTEL_EXPORTER_OTLP_TRACES_HEADERS:-}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-urlfy-web}
      - OTEL_SERVICE_VERSION=${OTEL_SERVICE_VERSION:-0.1.0}
      - TELEMETRY_ENABLED=${TELEMETRY_ENABLED:-false}
    volumes:
      - geoip_data:/app/geoip:ro
    networks:
      - dokploy-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:3000/api/health/ready']
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: '100m'
        max-file: '5'
    security_opt:
      - no-new-privileges:true

  # ─── Worker Service (Bun Redis Streams) ───────────────────────
  worker:
    build:
      context: ..
      dockerfile: docker/worker.Dockerfile
    init: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - REDIS_HOST=${REDIS_HOST:-}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - GEOIP_DB_PATH=/app/geoip/GeoLite2-City.mmdb
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET}
      - INTERNAL_ANALYTICS_SECRET=${INTERNAL_ANALYTICS_SECRET:-}
      # OpenTelemetry — same collector base URL as API service.
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_EXPORTER_OTLP_LOGS_ENDPOINT=${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:-}
      - OTEL_EXPORTER_OTLP_METRICS_ENDPOINT=${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-}
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      - OTEL_EXPORTER_OTLP_HEADERS=${OTEL_EXPORTER_OTLP_HEADERS:-}
      - OTEL_EXPORTER_OTLP_LOGS_HEADERS=${OTEL_EXPORTER_OTLP_LOGS_HEADERS:-}
      - OTEL_EXPORTER_OTLP_METRICS_HEADERS=${OTEL_EXPORTER_OTLP_METRICS_HEADERS:-}
      - OTEL_EXPORTER_OTLP_TRACES_HEADERS=${OTEL_EXPORTER_OTLP_TRACES_HEADERS:-}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-urlfy-worker}
      - OTEL_SERVICE_VERSION=${OTEL_SERVICE_VERSION:-0.1.0}
      - TELEMETRY_ENABLED=${TELEMETRY_ENABLED:-false}
    volumes:
      - geoip_data:/app/geoip:ro
    healthcheck:
      test: ['CMD', 'bun', 'run', 'healthcheck']
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    networks:
      - dokploy-network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '50m'
        max-file: '3'
    security_opt:
      - no-new-privileges:true

  # ─── GeoIP Downloader ─────────────────────────────────────────
  geoip-downloader:
    build:
      context: ../docker/geoip
      dockerfile: Dockerfile
    environment:
      - GEOIP_DB_PATH=/app/geoip/GeoLite2-City.mmdb
      - GEOIP_MAX_AGE_DAYS=25
      - GEOIP_MMDB_URL=https://cdn.jsdelivr.net/npm/geolite2-city/GeoLite2-City.mmdb.gz
    volumes:
      - geoip_data:/app/geoip
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '2'

volumes:
  geoip_data:

networks:
  dokploy-network:
    external: true
