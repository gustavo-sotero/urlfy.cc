services:
  # ═══════════════════════════════════════════════════════════════════
  # APLICAÇÃO PRINCIPAL (Next.js + ElysiaJS + Bun)
  # ═══════════════════════════════════════════════════════════════════
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    init: true # Proper signal handling (prevents zombie processes)
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - DATABASE_URL=postgres://urlfy:${DB_PASSWORD:-urlfy}@postgres:5432/urlfy
      - REDIS_URL=redis://redis:6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - GEOIP_DB_PATH=/app/geoip/GeoLite2-City.mmdb
      # Required secrets (use .env file or Docker secrets in production)
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-dev-secret-change-in-production-32chars}
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-dev-internal-secret-change-in-prod}
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-secret-change-in-production-32}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      # OpenTelemetry (optional - enabled when using docker-compose.signoz.yml)
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-urlfy-api}
      - OTEL_SERVICE_VERSION=${OTEL_SERVICE_VERSION:-0.0.0}
      - TELEMETRY_ENABLED=${TELEMETRY_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - geoip_data:/app/geoip:ro
    networks:
      - urlfy-network
    restart: unless-stopped
    # Resource limits (prevent runaway memory/CPU)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    # Logging configuration (prevent disk exhaustion)
    logging:
      driver: json-file
      options:
        max-size: '50m'
        max-file: '3'
    # Security options
    security_opt:
      - no-new-privileges:true
    read_only: false # Next.js needs write access to .next/cache

  # ═══════════════════════════════════════════════════════════════════
  # POSTGRESQL 16
  # ═══════════════════════════════════════════════════════════════════
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: urlfy
      POSTGRES_PASSWORD: ${DB_PASSWORD:-urlfy}
      POSTGRES_DB: urlfy
      POSTGRES_INITDB_ARGS: '--encoding=UTF-8 --lc-collate=C --lc-ctype=C'
    ports:
      - '127.0.0.1:5433:5432' # Bind to 5433 externally (5432 often in use locally)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - urlfy-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U urlfy -d urlfy']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: '100m'
        max-file: '3'

  # ═══════════════════════════════════════════════════════════════════
  # REDIS 7
  # ═══════════════════════════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    command: >-
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --tcp-keepalive 60
      --timeout 0
      --protected-mode yes
    ports:
      - '127.0.0.1:6379:6379' # Bind only to localhost (security)
    volumes:
      - redis_data:/data
    networks:
      - urlfy-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 600M
        reservations:
          cpus: '0.1'
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: '50m'
        max-file: '3'

  # ═══════════════════════════════════════════════════════════════════
  # GEOIP DOWNLOADER (Credential-free auto-download)
  # ═══════════════════════════════════════════════════════════════════
  geoip-downloader:
    build:
      context: ./geoip
      dockerfile: Dockerfile
    environment:
      - GEOIP_DB_PATH=/app/geoip/GeoLite2-City.mmdb
      - GEOIP_MAX_AGE_DAYS=25
      - GEOIP_MMDB_URL=https://cdn.jsdelivr.net/npm/geolite2-city/GeoLite2-City.mmdb.gz
    volumes:
      - geoip_data:/app/geoip
    networks:
      - urlfy-network
    restart: 'no'
    entrypoint: []
    command: ['/usr/local/bin/geoip-refresh.sh']

  # ═══════════════════════════════════════════════════════════════════
  # BACKUP SCHEDULER (PostgreSQL)
  # ═══════════════════════════════════════════════════════════════════
  # NOTA: Em ambiente Windows/dev, executar backups manualmente via:
  #       docker compose exec backup /backup.sh
  # backup:
  #   image: postgres:16-alpine
  #   environment:
  #     - PGHOST=postgres
  #     - PGDATABASE=urlfy
  #     - PGUSER=urlfy
  #     - PGPASSWORD=${DB_PASSWORD:-urlfy}
  #     - BACKUP_RETENTION_DAYS=7
  #   volumes:
  #     - ../scripts/backup.sh:/backup.sh:ro
  #     - backup_data:/backups
  #   networks:
  #     - urlfy-network
  #   profiles:
  #     - backup
  #   depends_on:
  #     - postgres

# ═════════════════════════════════════════════════════════════════════
# VOLUMES
# ═════════════════════════════════════════════════════════════════════
volumes:
  postgres_data:
    name: urlfy_postgres_data
  redis_data:
    name: urlfy_redis_data
  geoip_data:
    name: urlfy_geoip_data
  backup_data:
    name: urlfy_backup_data

# ═════════════════════════════════════════════════════════════════════
# NETWORKS
# ═════════════════════════════════════════════════════════════════════
networks:
  urlfy-network:
    driver: bridge
    name: urlfy-network
