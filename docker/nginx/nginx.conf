worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  keepalive_timeout 65;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  map $http_x_request_id $forwarded_request_id {
    default $http_x_request_id;
    '' $request_id;
  }

  upstream web_upstream {
    server web:3000;
    keepalive 32;
  }

  upstream api_upstream {
    server api:3001;
    keepalive 32;
  }

  server {
    listen 8080;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Never forward vendor-specific client IP headers from the browser. The
    # ingress is the trust boundary and upstream apps should only see headers
    # that this proxy intentionally rewrites.
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header True-Client-IP "";
    proxy_set_header X-Client-IP "";
    proxy_set_header X-Real-IP $remote_addr;
    # Overwrite X-Forwarded-For with the direct client address so that
    # upstream services cannot be spoofed by a client injecting forged
    # IP values into the header before it reaches the proxy.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Request-ID $forwarded_request_id;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    location = /api {
      return 308 /api/;
    }

    location /api/ {
      proxy_pass http://api_upstream;
    }

    location / {
      proxy_pass http://web_upstream;
    }
  }
}