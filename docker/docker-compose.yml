services:
  # ═══════════════════════════════════════════════════════════════════
  # APLICAÇÃO PRINCIPAL (Next.js + ElysiaJS + Bun)
  # ═══════════════════════════════════════════════════════════════════
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - DATABASE_URL=postgres://urlfy:${DB_PASSWORD:-urlfy}@postgres:5432/urlfy
      - REDIS_URL=redis://redis:6379
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://signoz-otel-collector:4318
      - OTEL_SERVICE_NAME=urlfy-api
      - GEOIP_DB_PATH=/app/geoip/GeoLite2-City.mmdb
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - geoip_data:/app/geoip:ro
    networks:
      - urlfy-network
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════
  # POSTGRESQL 16
  # ═══════════════════════════════════════════════════════════════════
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: urlfy
      POSTGRES_PASSWORD: ${DB_PASSWORD:-urlfy}
      POSTGRES_DB: urlfy
      POSTGRES_INITDB_ARGS: '--encoding=UTF-8 --lc-collate=C --lc-ctype=C'
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - urlfy-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U urlfy -d urlfy']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════
  # REDIS 7
  # ═══════════════════════════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --tcp-keepalive 60
      --timeout 0
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - urlfy-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════
  # SIGNOZ OTEL COLLECTOR
  # ═══════════════════════════════════════════════════════════════════
  signoz-otel-collector:
    image: signoz/signoz-otel-collector:0.102.8
    command:
      [
        '--config=/etc/otel-collector-config.yaml',
        '--feature-gates=-pkg.translator.prometheus.NormalizeName'
      ]
    ports:
      - '4317:4317' # OTLP gRPC
      - '4318:4318' # OTLP HTTP
    volumes:
      - ./signoz-otel-collector-config.yaml:/etc/otel-collector-config.yaml
    networks:
      - urlfy-network
    restart: unless-stopped
    profiles:
      - observability
    depends_on:
      - signoz-clickhouse

  # ═══════════════════════════════════════════════════════════════════
  # SIGNOZ QUERY SERVICE
  # ═══════════════════════════════════════════════════════════════════
  signoz-query-service:
    image: signoz/query-service:0.55.0
    ports:
      - '8080:8080'
    environment:
      - STORAGE=clickhouse
      - GODEBUG=netdns=go
      - CLICKHOUSE_TCP_PORT=9000
      - CLICKHOUSE_HTTP_PORT=8123
      - CLICKHOUSE_HOST=signoz-clickhouse
      - CLICKHOUSE_DATABASE_NAME=signoz_traces
      - SIGNOZ_LOCAL_DB_PATH=/var/lib/signoz/signoz.db
    volumes:
      - signoz_data:/var/lib/signoz
    networks:
      - urlfy-network
    restart: unless-stopped
    profiles:
      - observability
    depends_on:
      signoz-clickhouse:
        condition: service_healthy

  # ═══════════════════════════════════════════════════════════════════
  # SIGNOZ FRONTEND
  # ═══════════════════════════════════════════════════════════════════
  signoz-frontend:
    image: signoz/frontend:0.55.0
    ports:
      - '3301:3301'
    environment:
      - FRONTEND_API_ENDPOINT=http://signoz-query-service:8080
    networks:
      - urlfy-network
    restart: unless-stopped
    profiles:
      - observability
    depends_on:
      - signoz-query-service

  # ═══════════════════════════════════════════════════════════════════
  # SIGNOZ CLICKHOUSE
  # ═══════════════════════════════════════════════════════════════════
  signoz-clickhouse:
    image: clickhouse/clickhouse-server:24.1.2-alpine
    volumes:
      - signoz_clickhouse_data:/var/lib/clickhouse
      - ./signoz/clickhouse-config.xml:/etc/clickhouse-server/config.d/custom-config.xml:ro
    environment:
      - CLICKHOUSE_DB=signoz_traces
    networks:
      - urlfy-network
    healthcheck:
      test: ['CMD', 'clickhouse-client', '--query', 'SELECT 1']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    profiles:
      - observability

  # ═══════════════════════════════════════════════════════════════════
  # GEOIP DOWNLOADER (Credential-free auto-download)
  # ═══════════════════════════════════════════════════════════════════
  geoip-downloader:
    build:
      context: ./geoip
      dockerfile: Dockerfile
    environment:
      - GEOIP_DB_PATH=/app/geoip/GeoLite2-City.mmdb
      - GEOIP_MAX_AGE_DAYS=25
      - GEOIP_MMDB_URL=https://cdn.jsdelivr.net/npm/geolite2-city/GeoLite2-City.mmdb.gz
    volumes:
      - geoip_data:/app/geoip
    networks:
      - urlfy-network
    restart: 'no'
    entrypoint: []
    command: ['/usr/local/bin/geoip-refresh.sh']

  # ═══════════════════════════════════════════════════════════════════
  # BACKUP SCHEDULER (PostgreSQL)
  # ═══════════════════════════════════════════════════════════════════
  # NOTA: Em ambiente Windows/dev, executar backups manualmente via:
  #       docker compose exec backup /backup.sh
  # backup:
  #   image: postgres:16-alpine
  #   environment:
  #     - PGHOST=postgres
  #     - PGDATABASE=urlfy
  #     - PGUSER=urlfy
  #     - PGPASSWORD=${DB_PASSWORD:-urlfy}
  #     - BACKUP_RETENTION_DAYS=7
  #   volumes:
  #     - ../scripts/backup.sh:/backup.sh:ro
  #     - backup_data:/backups
  #   networks:
  #     - urlfy-network
  #   profiles:
  #     - backup
  #   depends_on:
  #     - postgres

# ═════════════════════════════════════════════════════════════════════
# VOLUMES
# ═════════════════════════════════════════════════════════════════════
volumes:
  postgres_data:
    name: urlfy_postgres_data
  redis_data:
    name: urlfy_redis_data
  signoz_clickhouse_data:
    name: urlfy_signoz_clickhouse_data
  signoz_data:
    name: urlfy_signoz_data
  geoip_data:
    name: urlfy_geoip_data
  backup_data:
    name: urlfy_backup_data

# ═════════════════════════════════════════════════════════════════════
# NETWORKS
# ═════════════════════════════════════════════════════════════════════
networks:
  urlfy-network:
    driver: bridge
    name: urlfy-network
