# Bun configuration file
# See: https://bun.sh/docs/runtime/bunfig

[test]
# Root `bun test` discovers app tests directly, so preload the shared web DOM
# bootstrap here as well. Keep root runs free from the web-only LogTape mocks
# so non-web packages still exercise their real logging integrations.
preload = ["./apps/web/tests/root-setup.ts"]

# Playwright E2E specs use the .spec.ts suffix, which Bun also discovers.
# Keep them on the Playwright runner only so root `bun test` executes the
# unit/integration suite without loader errors from `@playwright/test`.
pathIgnorePatterns = ["apps/web/tests/e2e/**"]

# Test timeout (in milliseconds) - default is 5000
timeout = 10000

# Coverage configuration
coverage = false
coverageDir = "coverage"

# Reporter
#reporter = "spec"

# Retry failed tests
retry = 0

# Bail on first failure (useful for CI)
bail = false

# Playwright E2E specs are intentionally excluded above and should be run via
# `bun run test:e2e`.
